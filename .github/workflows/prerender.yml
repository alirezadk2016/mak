name: Pre-render (SSG)

# Regenerates the static pre-rendered HTML whenever source changes land on
# main, then commits it back. Keeps SEO snapshots fresh with zero manual work.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'prerendered/**'
      - 'public/sitemap.xml'
      - 'public/robots.txt'
      - '.github/**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: prerender-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prerender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build + pre-render
        run: npm run build:static

      - name: Commit refreshed pre-render (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prerendered public/sitemap.xml public/robots.txt
          if git diff --staged --quiet; then
            echo "Pre-rendered output already up to date — nothing to commit."
          else
            git commit -m "chore: refresh pre-rendered HTML [skip ci]"
            git push
          fi
